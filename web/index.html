 const cv=box.querySelector('canvas'),tip=box.querySelector('.tip'),lg=box.querySelector('.lg');let hov=null,G=null,pin=null;

 function draw(){prep();const dpr=devicePixelRatio||1,W=cv.clientWidth,H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;const x=cv.getContext('2d');x.scale(dpr,dpr);
  const vis=cfg.filter(c=>!hid[c.k]&&(series[c.k]||[]).length);G=null;
  if(!vis.length){x.fillStyle='#8a94ad';x.font='13px system-ui';x.fillText(cfg.some(c=>(series[c.k]||[]).length)?'Todas las líneas ocultas (pulsa la leyenda)':'Aún sin datos',14,26);return}
  let t0=1e99,t1=0,y0=1e99,y1=-1e99;vis.forEach(c=>series[c.k].forEach(p=>{t0=Math.min(t0,p.ts);t1=Math.max(t1,p.ts);y0=Math.min(y0,p.equity);y1=Math.max(y1,p.equity)}));
  if(y1-y0<1e-6){y0-=.01;y1+=.01}const pad=(y1-y0)*.1;y0-=pad;y1+=pad;if(t1==t0)t1=t0+1;const L=48,B=20,T=8,R=8;
  const PX=t=>L+(t-t0)/(t1-t0)*(W-L-R),PY=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);G={PX,PY,t0,t1,L,R,W,H,vis};

  for(let i=0;i<=3;i++){const tt=t0+(t1-t0)*i/3;x.fillText(new Date(tt*1000).toLocaleTimeString('es-ES',{timeZone:TZ,hour:'2-digit',minute:'2-digit'}),L+(W-L-R)*i/3-14,H-5)}
  const order=vis.filter(c=>c.k!==hov).concat(vis.filter(c=>c.k===hov));
  order.forEach(c=>{const on=hov===c.k;x.globalAlpha=hov&&!on?0.14:1;x.strokeStyle=c.color;x.lineWidth=on?3.4:1.9;x.setLineDash(c.dash);x.lineJoin='round';x.beginPath();series[c.k].forEach((p,i)=>{const px=PX(p.ts),py=PY(p.equity);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()});

 function hit(ev,touch){if(!G)return null;const r=cv.getBoundingClientRect(),mx=ev.clientX-r.left,my=ev.clientY-r.top,th=touch?24:14;let best=null;
  G.vis.forEach(c=>{const s=series[c.k];for(let i=0;i<s.length;i++){const ax=G.PX(s[i].ts),ay=G.PY(s[i].equity);let d=Math.hypot(ax-mx,ay-my);
    if(i+1<s.length){const bx=G.PX(s[i+1].ts),by=G.PY(s[i+1].equity),dx=bx-ax,dy=by-ay,l2=dx*dx+dy*dy;if(l2>0){const u=Math.max(0,Math.min(1,((mx-ax)*dx+(my-ay)*dy)/l2));d=Math.min(d,Math.hypot(ax+u*dx-mx,ay+u*dy-my))}}

  if(!best)return null;const s=series[best.c.k],tx=G.t0+(mx-G.L)/(G.W-G.L-G.R)*(G.t1-G.t0);let p=s[0];s.forEach(q=>{if(Math.abs(q.ts-tx)<Math.abs(p.ts-tx))p=q});return {c:best.c,p,mx,my}}
 function show(h){window.HOVERING=!!h;if(!h){hov=null;pin=null;tip.classList.add('hide');draw();sync();return}

  tip.classList.remove('hide');const tw=tip.offsetWidth,th=tip.offsetHeight,W=cv.clientWidth,H=cv.clientHeight;
  tip.style.left=Math.max(4,Math.min(W-tw-4,h.mx+14))+'px';tip.style.top=Math.max(4,Math.min(H-th-4,h.my>H/2?h.my-th-12:h.my+16))+'px'}
 cv.style.touchAction='pan-y';
 cv.addEventListener('pointermove',e=>{const h=hit(e,e.pointerType!=='mouse');if(e.pointerType==='mouse'||h)show(h)});

 const solo=v=>{const only=cfg.every(c=>c.k==v?!hid[c.k]:!!hid[c.k]);cfg.forEach(c=>{hid[c.k]=only?false:c.k!=v});hov=null;pin=null;tip.classList.add('hide');draw();sync()};

  <div class="vf"><label>Variante <select id="vvar"><option value="">Todas</option>${F.variantes.map(v=>`<option ${v==VV.v?'selected':''}>${v}</option>`).join('')}</select></label> <label><input type="checkbox" id="vrej" ${VV.rej?'checked':''}> mostrar rechazos</label></div>
  <div class="evl">${rows||'<div class="mut" style="padding:14px">Sin eventos con este filtro.</div>'}</div>`;
  $('#vvar').onchange=e=>{VIV.v=e.target.value;render()};$('#vrej').onchange=e=>{VIV.rej=e.target.checked;render()}}
 else if(tab=='cer'){const b=await J('/api/brain?limit=25');PROF=b.profiles||PROF;STR=b.strategies||STR;const H=b.health;const hb=H.heartbeat_age;
  const ICON={deteccion:'📡',espera:'⏳',decision:'⚖️',variante:'🧾',entrada:'🟢',salida:'🔴',cierre:'🏁'};
  const SN={deteccion:'Detección',pre:'Filtro previo · liquidez inicial',curva:'Filtro 1 · Curva de pump.fun',pool:'Filtro 2 · Pool PumpSwap',grafico:'Filtro 3 · Gráfico falso',holders:'Filtro 4 · Holders y autoridades',socials:'Filtro 5 · Socials (desempate débil)',espera:'Espera de datos',decision:'Decisión'};
  const live=b.live.map(p=>`<tr><td>${p.variant}${p.entry_n>1?' <span class="tag">reentrada #'+p.entry_n+'</span>':''}</td><td>${mint(p.mint)}</td><td>${p.state=='pending_buy'?'comprando…':p.state=='pending_sell'?'vendiendo ('+p.pending+')':'abierta'}</td><td>${pct(p.ret)}</td><td>${p.ret==null||p.to_stop==null?'–':f(p.to_stop,1)+' pts'}</td><td>${p.next_tp==null?'–':f(p.next_tp,1)+' pts'}</td><td>${p.time_left==null?'–':dur(Math.max(0,p.time_left))}</td></tr>`).join('');
  const state=[
   `<div>📡 <b>Vigilando migraciones</b>: último sondeo hace ${f(b.last_poll_age,1)} s ${b.last_poll_age<15?'<span class="ok">● ok</span>':'<span class="bad">● atascado</span>'}</div>`,
   `<div>🔬 <b>Evaluando ahora</b>: ${b.evaluating.length?b.evaluating.map(e=>mint(e.mint)+` (hace ${f(e.age,0)} s, ${e.last?e.last.label:'…'})`).join(' · '):'<span class="mut">ningún token</span>'}</div>`,
   `<div>📈 <b>Posiciones en curso</b>: ${b.live.length} (el motor mira stops cada 2 s; latido lector hace ${f(hb.lector,1)} s)</div>`,
   `<div>🧊 <b>Congelaciones del box</b>: ${H.stall&&H.stall.ultima?'última '+tm(H.stall.ultima.start_ts)+' · duró '+dur(H.stall.ultima.dur_s)+' · hoy '+H.stall.n_24h+' ('+f(H.stall.total_24h_min,0)+' min) <span class="'+(DATA_TS-H.stall.ultima.end_ts<3600?'bad':'mut')+'">'+(DATA_TS-H.stall.ultima.end_ts<3600?'● reciente':'')+'</span>':'<span class="ok">ninguna</span>'}. Las migraciones detectadas con más de ${H.stall?H.stall.max_detect_age_s:20} s de retraso se rechazan como «detectada_tarde» (no se opera).</div>`,
   `<div>🧮 <b>Créditos Helius hoy</b>: ${f(H.credits_today,0)} de ${f(H.credit_cap_day,0)}</div>`].join('');
  const sigs=b.signals.map((s,ix)=>{const groups={};s.steps.forEach(r=>{(groups[r.step]=groups[r.step]||[]).push(r)});
   const order=['deteccion','pre','curva','espera','pool','grafico','holders','socials','decision'];
   const body=order.filter(k=>groups[k]).map(k=>{const g=groups[k];
     if(['deteccion','espera','decision'].includes(k))return g.map(r=>`<div style="margin:5px 0">${ICON[k]} <b>${r.label}</b> <span class="mut">${r.value}${r.note?' · '+r.note:''}</span></div>`).join('');
     return `<div style="margin:8px 0 2px;font-weight:600">${SN[k]||k}</div><div class="tw"><table><thead><tr><th>Comprobación</th><th>Valor</th><th>Umbral</th><th>Resultado</th></tr></thead><tbody>${g.map(r=>`<tr><td>${r.label}</td><td>${r.value}</td><td class="mut">${r.threshold}</td><td>${r.ok==null?'ℹ️':r.ok?'<span class="ok">✅ pasa</span>':'<span class="bad">❌ falla</span>'}</td></tr>`).join('')}</tbody></table></div>`}).join('');
   const vars=Object.keys(s.variants).sort((a,b)=>(parseInt(a.slice(1))||0)-(parseInt(b.slice(1))||0)).map(v=>`<details style="margin:6px 0"><summary><b>${v}</b> <span class="tag">${(STR[v]||{}).nombre||'ronda 1'}</span> <span class="mut">${s.variants[v].slice(-1)[0].label.slice(0,90)}</span></summary>${s.variants[v].map(r=>`<div style="margin:4px 0 4px 14px">${tm(r.ts)} ${ICON[r.step]||''} ${r.label} <span class="mut">${r.value||''}${r.note?' · '+r.note:''}</span></div>`).join('')}</details>`).join('');
   const st=s.status=='accepted'?'<span class="ok">ACEPTADA</span>':s.status=='rejected'?`<span class="bad">RECHAZADA · ${s.reason}</span>`:'<span class="warn">evaluando…</span>';
   return `<details class="card" style="margin:8px 0" ${ix<2?'open':''}><summary style="cursor:pointer">${tm(s.detected_ts)} · ${mint(s.mint)} · ${st} <span class="mut">· detectada a ${f(s.detect_latency_s,1)} s del bloque</span></summary>${body}${vars?`<div style="margin-top:10px;font-weight:600">Qué hizo cada variante</div>${vars}`:''}</details>`}).join('');
  const tl=b.timeline.map(r=>`<div style="padding:3px 0;border-bottom:1px solid var(--bd)"><span class="mut">${tm(r.ts)}</span> ${ICON[r.step]||''} ${r.mint?mint(r.mint):''} ${r.variant?'<span class="tag">'+r.variant+'</span>':''} ${r.label} <span class="mut">${r.value||''}</span></div>`).join('');
  M.innerHTML=`<div class="card"><h3>🧠 Qué está haciendo el bot ahora</h3><div style="line-height:1.9">${state}</div></div>
  <div class="sec">Posiciones vivas: distancia a stop, a objetivo y al corte por tiempo</div>${live?`<div class="tw"><table><thead><tr><th>Variante</th><th>Token</th><th>Estado</th><th>Retorno</th><th>Hasta el stop</th><th>Hasta el TP</th><th>Hasta el corte</th></tr></thead><tbody>${live}</tbody></table></div>`:'<div class="card mut">Ninguna posición abierta ahora mismo.</div>'}
  <div class="sec">Cada migración, paso a paso (se actualiza cada 5 s)</div>${sigs||'<div class="card mut">Aún no se ha detectado ninguna migración.</div>'}
  <div class="sec">Línea de tiempo en directo</div><div class="card" style="max-height:420px;overflow:auto;font-size:13px">${tl||'<span class="mut">Sin eventos todavía</span>'}</div>
  <p class="note">Todo lo que ves aquí lo calcula código con reglas fijas; no interviene ninguna IA. Los valores y umbrales son los reales de cada decisión.</p>`}
 else if(tab=='ayu'){const c=await J('/api/config');M.innerHTML=`<div class="card" style="line-height:1.7"><b>Qué hace</b><br>Detecta cada token que migra de pump.fun a PumpSwap, aplica filtros por reglas (sin IA) y simula entradas/salidas en <b>paper</b> con las reservas reales de la pool, retraso, impacto y comisiones. Dieciocho variantes en paralelo (V1–V12 y las seis V13 «copia fiel» de s1mple/bigPNL/ro1x, todas con 1 SOL base y 15 SOL de banco cada una); cada una con su propia puerta de entrada y reglas de salida. La ronda 1 (0,05–1,5 SOL, stop −36 %/objetivo +43 %) queda como histórico.<br><br>
  <b>Métricas</b>: <b>WR</b> = % de trades con PnL neto &gt; 0 · <b>PF</b> (profit factor) = ganancias totales / pérdidas totales (&gt;1,3 aguantando costes dobles es el listón para pasar a real) · <b>Gan./Pérd. media</b> = media en SOL de trades ganadores/perdedores · <b>Equity</b> = banco virtual + PnL cerrado + PnL abierto (valorado vendiendo con impacto) · <b>Baseline</b> = qué habría hecho comprar a la 1ª lectura y vender a los ${c.baseline.hold_s}s sin costes.<br><br>
  <b>Límites</b>: es paper; la latencia real y la competencia pueden empeorar los fills. Detalles en el README.</div>
  <div class="sec">Configuración activa (config.yaml)</div><div class="card"><pre style="margin:0;white-space:pre-wrap;font-size:12px">${JSON.stringify(c,null,1)}</pre></div>`}
 }catch(e){M.innerHTML=`<div class="card bad">Error cargando datos: ${e}</div>`}}
render();let tick=0;setInterval(()=>{tick++;if(!document.hidden&&!window.HOVERING&&(tab=='cer'||tab=='viv'||tick%3==0))render()},5000);
</script></body></html>
